name: Daily Report Automation

on:
  schedule:
    # 매일 한국시간 08:30 (UTC 23:30) 자동 실행
    - cron: '30 23 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas openpyxl google-generativeai

      - name: Run Daily Report Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python build_report.py

      - name: Commit and Push Updated Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html daily_report_*.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: Update daily report [$(date +'%Y-%m-%d')]"
          git pull --rebase origin main
          git push origin main
