name: Daily Report Automation

on:
  schedule:
    # KST 기준 매일 00:00(UTC 15:00) — 전날 SMP·발전량이 먼저 올라오는 대로 반영
    - cron: '0 15 * * *'
    # KST 기준 매일 아침 07:20 (UTC 22:20) — 임원 확인(08:00~) 전에 끝나도록. GitHub 지연(최대 30분 안팎)을 감안해 일찍 설정
    - cron: '20 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kpx-data
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas openpyxl requests

      - name: Generate Master data.json (Daily Update)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          # 🎉 backfill_generator.py 실행을 삭제하여 힘들게 모은 API 데이터가 지워지는 것을 방지함
          python build_report.py

      - name: Apply KPX SMP (전력거래소 홈페이지 값으로 SMP 맞춤)
        continue-on-error: true
        run: |
          python collect_kpx_smp.py
          python apply_kpx_smp.py

      - name: Make recent data (빠른 로딩용 data_recent.json)
        run: python make_recent.py

      - name: Cleanup Old HTMLs and Commit SPA
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json data_recent.json smp_live.json
          git diff --staged --quiet || git commit -m "Auto: Update SPA master data.json [$(date +'%Y-%m-%d')]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "push 재시도 $i/5"; sleep 5
          done
          exit 1
