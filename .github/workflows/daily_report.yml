name: Daily Report Automation

on:
  schedule:
    # 매일 한국시간 08:30 (UTC 23:30) 자동 실행
    - cron: '30 23 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas openpyxl requests

      - name: Generate Master data.json (First Run or API update)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          # data.json이 없으면 엑셀 기반으로 2022~현재 전체 생성, 있으면 일일 업데이트 실행
          if [ ! -f "data.json" ]; then
            python backfill_generator.py
          else
            python build_report.py
          fi

      - name: Cleanup Old HTMLs and Commit SPA
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 불필요한 과거 1,700여 개 개별 HTML 일괄 삭제
          git rm -f daily_report_*.html 2>/dev/null || true
          git add index.html data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: Update SPA data.json [$(date +'%Y-%m-%d')]"
          git pull --rebase origin main
          git push origin main
