name: Daily Power Market Report

on:
  schedule:
    # 매일 한국 시간 오전 08:30 (UTC 기준 23:30) 자동 실행
    - cron: '30 23 * * *'
  # 필요할 때 수동으로 즉시 실행 버튼을 누를 수 있도록 설정
  workflow_dispatch:

jobs:
  build-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install google-generativeai

      - name: 전력시장 보고서 생성 스크립트 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python build_report.py

      - name: 생성된 HTML 보고서 다운로드 보관 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: daily-power-report
          path: "*.html"
          retention-days: 30
