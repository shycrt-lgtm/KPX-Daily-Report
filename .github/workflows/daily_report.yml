name: Daily Report Automation

on:
  schedule:
    # 매일 한국 시간 08:30 (UTC 기준 전일 23:30) 자동 실행
    - cron: '30 23 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 활성화

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas openpyxl requests

      - name: Generate Master data.json (Full Historical & Daily Update)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          # 1. 과거 전체(2022~현재) 월별 LNG 단가 및 실적을 정확히 data.json에 생성/재반영
          python backfill_generator.py
          # 2. 최신 전일 실적(SMP 및 지표) 추가 갱신
          python build_report.py

      - name: Cleanup Old HTMLs and Commit SPA
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 저장소를 어지럽히던 과거 1,700여 개 개별 HTML 파일 일괄 정리
          git rm -f daily_report_*.html 2>/dev/null || true
          git add index.html data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: Update SPA master data.json [$(date +'%Y-%m-%d')]"
          git pull --rebase origin main
          git push origin main
