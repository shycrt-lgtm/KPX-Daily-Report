name: SMP Live Collect

on:
  schedule:
    # 매시 5분(UTC) 실행 — 하루전 18시 이후 공표되는 내일 SMP 를 전력거래소 홈페이지에서 곧바로 반영
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kpx-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Collect SMP (공공데이터포털, 보조)
        continue-on-error: true   # 공공데이터포털이 느려도 아래 단계는 계속 진행
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collect_smp_live.py

      - name: Collect SMP (전력거래소 홈페이지, 우선)
        continue-on-error: true
        run: python collect_kpx_smp.py

      - name: Apply SMP to data.json
        continue-on-error: true
        run: python apply_kpx_smp.py

      - name: Make recent data (빠른 로딩용 data_recent.json)
        run: python make_recent.py

      - name: Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add smp_live.json data.json data_recent.json
          git diff --staged --quiet && exit 0
          git commit -m "Auto: SMP live [$(date +'%Y-%m-%d %H:%M')]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "push 재시도 $i/5"; sleep 5
          done
          exit 1
