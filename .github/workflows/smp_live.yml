name: SMP Live Collect

on:
  schedule:
    # 매시 5분(UTC) 실행 — 내일 SMP 발표 후 곧바로 화면에 반영
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Collect SMP
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collect_smp_live.py

      - name: Make recent data (빠른 로딩용 data_recent.json)
        run: python make_recent.py

      - name: Commit smp_live.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add smp_live.json data_recent.json
          git diff --staged --quiet || git commit -m "Auto: SMP live [$(date +'%Y-%m-%d %H:%M')]"
          git pull --rebase origin main
          git push origin main
